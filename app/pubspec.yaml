name: biblioteca
description: "Práctica 5 — Biblioteca ESCOM: app Flutter multiplataforma con API REST, Open Library, SQLite offline y sincronización."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  dio: ^5.11.1
  sqflite: ^2.4.5
  path: ^1.9.0
  path_provider: ^2.1.5
  flutter_secure_storage: ^11.2.0
  connectivity_plus: 7.0.0
  google_sign_in: ^7.2.0
  uuid: ^4.6.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true
